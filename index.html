<title>阪神 複勝判定ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Roboto+Mono:wght@400;500;700&display=swap">
<style>
  :root{
    --bg:#F2EFE8; --panel:#FBF9F5; --edge:#D8D2C5; --edge2:#EAE5DA;
    --ink:#1C2128; --ink2:#5A5F68; --ink3:#8B8F98;
    --accent:#9A6B1F; --accent-soft:#F0E4CC;
    --go:#1F6B4A; --go-soft:#DCEBE2;
    --hold:#6F7681; --hold-soft:#E7E7E4;
    --miss:#9B3B27;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#11161C; --panel:#182028; --edge:#2B353F; --edge2:#222B34;
    --ink:#E7E3DA; --ink2:#A2A9B3; --ink3:#6E767F;
    --accent:#D9A84E; --accent-soft:#2E2618;
    --go:#4FBE8B; --go-soft:#12271E;
    --hold:#8A929C; --hold-soft:#1D242B;
    --miss:#E08872;
  }}
  :root[data-theme="dark"]{
    --bg:#11161C; --panel:#182028; --edge:#2B353F; --edge2:#222B34;
    --ink:#E7E3DA; --ink2:#A2A9B3; --ink3:#6E767F;
    --accent:#D9A84E; --accent-soft:#2E2618;
    --go:#4FBE8B; --go-soft:#12271E;
    --hold:#8A929C; --hold-soft:#1D242B;
    --miss:#E08872;
  }
  *{box-sizing:border-box}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px; margin:0 auto; padding-inline:16px; padding-block:0 52px}
  .mono{font-family:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace; font-variant-numeric:tabular-nums}
  button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}

  header{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:10;
    background:var(--bg); border-bottom:1px solid var(--edge);
    margin-inline:-16px; padding:9px 16px 8px;
  }
  .hrow{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .htitle{font-size:13px; font-weight:700; letter-spacing:.05em; color:var(--ink2); min-width:0;
          overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .hclock{font-size:12px; color:var(--ink3); flex:0 0 auto}
  .back{font-size:12.5px; color:var(--accent); font-weight:700; padding:2px 0; flex:0 0 auto}

  /* 判定パネル */
  .verdict{margin-top:16px; border:1px solid var(--edge); border-radius:3px; background:var(--panel); overflow:hidden}
  .vtop{display:flex; align-items:stretch; border-bottom:1px solid var(--edge2)}
  .vmark{flex:0 0 auto; width:80px; display:grid; place-items:center; border-right:1px solid var(--edge2);
         font-size:30px; font-weight:900}
  .vmark.no{background:var(--hold-soft); color:var(--hold)}
  .vmark.go{background:var(--go-soft); color:var(--go)}
  .vbody{flex:1 1 auto; padding:13px 15px; min-width:0}
  .vlabel{font-size:10.5px; letter-spacing:.14em; color:var(--ink3); font-weight:700}
  .vmain{font-size:22px; font-weight:900; line-height:1.25; margin-top:2px; text-wrap:balance}
  .vsub{font-size:12.5px; color:var(--ink2); margin-top:5px}
  .vmeta{display:flex; gap:16px; flex-wrap:wrap; padding:8px 15px; font-size:11px; color:var(--ink3)}
  .vmeta b{color:var(--ink2); font-weight:500}
  .stale{color:var(--miss); font-weight:700}
  .warnbar{
    margin-top:12px; padding:9px 13px; border:1px solid var(--miss); border-radius:3px;
    background:var(--panel); font-size:12px; color:var(--miss); line-height:1.5;
  }
  .warnbar b{font-weight:700}

  h2{font-size:11.5px; letter-spacing:.14em; color:var(--ink3); font-weight:700; margin:24px 0 8px}

  /* レース一覧（カード列） */
  .rlist{display:grid; gap:1px; background:var(--edge2); border:1px solid var(--edge); border-radius:3px; overflow:hidden}
  .rcard{
    display:grid; grid-template-columns:34px 1fr auto; gap:11px; align-items:center;
    background:var(--panel); padding:10px 13px; width:100%; text-align:left;
  }
  .rcard:hover{background:var(--accent-soft)}
  .rcard.next{background:var(--accent-soft)}
  .rcard.done{opacity:.55}
  .rno{font-size:16px; font-weight:900; color:var(--ink3); text-align:center}
  .rmid{min-width:0}
  .rname{font-size:13.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .rsub{font-size:11px; color:var(--ink3); margin-top:1px}
  .rright{text-align:right; flex:0 0 auto}
  .rbest{font-size:14px; font-weight:700; color:var(--ink2)}
  .rbest.over{color:var(--go)}
  .rarrow{font-size:10.5px; color:var(--ink3); margin-top:1px}
  .pill{display:inline-block; padding:1px 6px; border-radius:2px; font-size:10px; font-weight:700}
  .pill.go{background:var(--go-soft); color:var(--go)}
  .pill.shape{background:var(--hold-soft); color:var(--ink2)}

  /* レース詳細 */
  .sec{margin-top:14px; border:1px solid var(--edge); border-radius:3px; background:var(--panel); overflow:hidden}
  .sechead{padding:9px 14px; border-bottom:1px solid var(--edge2); font-size:11px;
           letter-spacing:.1em; font-weight:700; color:var(--ink3)}
  .secbody{padding:12px 14px; font-size:13px}
  .secbody p{margin:0 0 9px} .secbody p:last-child{margin:0}
  .kv{display:flex; gap:16px; flex-wrap:wrap; padding:10px 14px; font-size:12px; border-bottom:1px solid var(--edge2)}
  .kv div{white-space:nowrap} .kv b{color:var(--ink3); font-weight:500; font-size:10.5px; display:block}

  .hrow2{display:grid; grid-template-columns:20px 1fr 62px 62px; gap:9px; align-items:center;
         padding:7px 14px; border-bottom:1px solid var(--edge2); font-size:12.5px}
  .hrow2:last-child{border-bottom:0}
  .hrow2.head{font-size:10px; letter-spacing:.06em; color:var(--ink3); font-weight:700}
  .hrank{font-size:11px; color:var(--ink3); text-align:center}
  .hname{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .hodds{text-align:right; color:var(--ink2)}
  .hdv{text-align:right; font-weight:500}
  .pos{color:var(--go)} .neg{color:var(--miss)}
  .thr{color:var(--ink3); font-size:10.5px}

  /* 出走馬カード */
  .hcard{padding:10px 13px; border-bottom:1px solid var(--edge2)}
  .hcard:last-child{border-bottom:0}
  .hcard.target{background:var(--accent-soft)}
  .h1{display:flex; align-items:baseline; gap:7px; flex-wrap:wrap}
  .hpop{font-size:10px; font-weight:700; color:var(--ink3); background:var(--hold-soft);
        padding:1px 5px; border-radius:2px; flex:0 0 auto}
  .hpop.t{background:var(--accent); color:#fff}
  .mpop{font-size:10px; font-weight:700; padding:1px 5px; border-radius:2px; flex:0 0 auto;
        background:var(--hold-soft); color:var(--ink3)}
  .mpop.up{background:var(--go-soft); color:var(--go)}
  .mpop.dn{background:var(--panel); color:var(--miss); border:1px solid var(--miss)}
  .pickbar{padding:10px 14px; border-bottom:1px solid var(--edge2); font-size:12.5px}
  .pickbar.dis{background:var(--accent-soft)}
  .pickbar b{font-weight:700}
  .pickbar .sub{display:block; font-size:11px; color:var(--ink3); margin-top:2px}
  .hnm{font-size:14px; font-weight:700}
  .hsub{font-size:11px; color:var(--ink3)}
  .h2r{display:flex; gap:14px; flex-wrap:wrap; margin-top:5px; font-size:12px}
  .h2r div{white-space:nowrap}
  .h2r b{display:block; font-size:9.5px; letter-spacing:.06em; color:var(--ink3); font-weight:500}
  .h3r{margin-top:5px; font-size:11px; color:var(--ink3)}
  .h3r span:not(:last-child)::after{content:" ／ "; color:var(--edge)}
  .ev{font-weight:700}
  .ev.good{color:var(--go)} .ev.bad{color:var(--ink3)}
  .dvbar{display:inline-block; width:44px; height:5px; background:var(--hold-soft);
         border-radius:3px; position:relative; vertical-align:middle; margin-left:5px}
  .dvbar i{position:absolute; top:0; height:5px; border-radius:3px}
  .dvbar i.p{left:50%; background:var(--go)} .dvbar i.n{right:50%; background:var(--miss)}
  /* トップの注目買い目 */
  .pickrow{display:grid; grid-template-columns:52px 1fr auto; gap:11px; align-items:center;
           padding:9px 13px; border-bottom:1px solid var(--edge2); background:var(--panel)}
  .pickrow:last-child{border-bottom:0}
  .pkroi{font-size:15px; font-weight:700; text-align:right; color:var(--ink3)}
  .pkroi.over{color:var(--go)}
  .pkpay{font-size:14px; font-weight:700; text-align:right; color:var(--accent)}
  .pkmid{min-width:0}
  .pkbet{font-size:12.5px; font-weight:500}
  .pkbet em{font-style:normal; color:var(--ink3); font-size:11px; margin-right:5px}
  .pkpick{font-size:11.5px; color:var(--ink2); margin-top:1px;
          overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .pkmeta{font-size:10px; color:var(--ink3); margin-top:1px}
  .pkgo{font-size:10.5px; color:var(--accent); font-weight:700; white-space:nowrap}
  .tabs{display:flex; gap:0; border:1px solid var(--edge); border-radius:3px; overflow:hidden; margin-top:8px}
  .tab{flex:1 1 0; padding:8px 6px; font-size:12px; font-weight:700; text-align:center;
       background:var(--panel); color:var(--ink3); border-right:1px solid var(--edge2)}
  .tab:last-child{border-right:0}
  .tab.on{background:var(--accent-soft); color:var(--ink)}
  .resbar{padding:10px 14px; border-bottom:1px solid var(--edge2); font-size:12.5px;
          background:var(--hold-soft)}
  .resbar.ok{background:var(--go-soft)}
  .resbar b{font-weight:700}
  .resbar .sub{display:block; font-size:11px; color:var(--ink3); margin-top:2px}
  .rres{font-size:10px; font-weight:700; padding:1px 5px; border-radius:2px; margin-left:5px;
        background:var(--hold-soft); color:var(--ink3)}
  .rres.hit{background:var(--go-soft); color:var(--go)}
  .pkhint{padding:10px 13px; font-size:11px; color:var(--ink3); border-top:1px solid var(--edge2);
          line-height:1.6}

  .legend{padding:13px 14px; font-size:12px; color:var(--ink2); line-height:1.7; border-top:1px solid var(--edge2)}
  .legend b{color:var(--ink); font-weight:700}
  .lgitem{margin-bottom:16px} .lgitem:last-child{margin-bottom:0}
  .lgitem>b{display:block; font-size:12.5px; margin-bottom:5px; padding-bottom:4px;
            border-bottom:1px solid var(--edge2)}
  .legend p{margin:0 0 6px} .legend p:last-child{margin:0}
  .legend .howto{padding-left:9px; border-left:2px solid var(--accent); color:var(--ink)}
  .legend .dt{margin:8px 0}

  .cond{display:grid; grid-template-columns:20px 1fr auto; gap:9px; align-items:center;
        padding:8px 14px; border-bottom:1px solid var(--edge2); font-size:12.5px}
  .cond:last-child{border-bottom:0}
  .cmark{text-align:center; font-weight:700}
  .cmark.ok{color:var(--go)} .cmark.ng{color:var(--miss)}
  .cname small{display:block; color:var(--ink3); font-size:10.5px; line-height:1.4}

  .fbrow{display:grid; grid-template-columns:54px 1fr; gap:11px; align-items:start;
         padding:9px 14px; border-bottom:1px solid var(--edge2)}
  .fbrow:last-child{border-bottom:0}
  .fbroi{font-size:15px; font-weight:700; text-align:right; color:var(--ink3)}
  .fbroi.over{color:var(--go)}
  .fbbet{font-size:13px; font-weight:500}
  .fbpick{font-size:12px; color:var(--ink2); margin-top:1px}
  .fbmeta{font-size:10.5px; color:var(--ink3); margin-top:2px}
  .fbwarn{font-size:10.5px; color:var(--miss); margin-top:3px; padding-left:7px; border-left:2px solid var(--miss)}

  .note{margin-top:24px; padding:13px 15px; border-left:2px solid var(--accent);
        background:var(--panel); border-radius:0 3px 3px 0; font-size:12.5px; color:var(--ink2)}
  .note b{color:var(--ink); font-weight:700}
  .note p{margin:0 0 8px} .note p:last-child{margin:0}
  .note ul{margin:6px 0 0; padding-left:17px} .note li{margin:3px 0}
  .log{margin-top:8px; font-size:11px; color:var(--ink3); display:flex; flex-wrap:wrap; gap:3px 9px}
  /* 解説ページ */
  .navlink{
    display:block; width:100%; text-align:left; margin-top:12px; padding:11px 14px;
    border:1px solid var(--edge); border-radius:3px; background:var(--panel); font-size:13px;
  }
  .navlink:hover{background:var(--accent-soft)}
  .navlink b{display:block; font-weight:700}
  .navlink small{color:var(--ink3); font-size:11.5px}
  .doc{font-size:13.5px; line-height:1.85}
  .doc h3{font-size:14px; font-weight:900; margin:26px 0 8px; letter-spacing:.01em}
  .doc h3:first-child{margin-top:16px}
  .doc p{margin:0 0 11px}
  .doc ul{margin:0 0 11px; padding-left:19px} .doc li{margin:4px 0}
  .doc .lead{font-size:14px; color:var(--ink2); border-left:2px solid var(--accent);
             padding-left:12px; margin-bottom:18px}
  .doc code{font-family:"Roboto Mono",monospace; font-size:12px; background:var(--hold-soft);
            padding:1px 5px; border-radius:2px}
  .dt{overflow-x:auto; margin:0 0 14px; border:1px solid var(--edge); border-radius:3px}
  .dt table{border-collapse:collapse; width:100%; min-width:380px; font-size:12px; background:var(--panel)}
  .dt th{background:var(--panel); text-align:left; font-size:10.5px; letter-spacing:.05em; color:var(--ink3);
         padding:7px 10px; border-bottom:1px solid var(--edge); white-space:nowrap}
  .dt td{padding:7px 10px; border-bottom:1px solid var(--edge2); white-space:nowrap}
  .dt tr:last-child td{border-bottom:0}
  .dt td.num{text-align:right; font-family:"Roboto Mono",monospace; font-variant-numeric:tabular-nums}
  .dt .hi{color:var(--go); font-weight:700} .dt .lo{color:var(--miss)}
  .callout{margin:0 0 14px; padding:11px 14px; background:var(--panel); border:1px solid var(--edge);
           border-radius:3px; font-size:12.5px; color:var(--ink2)}
  .callout b{color:var(--ink)}

  footer{margin-top:20px; font-size:10.5px; color:var(--ink3); line-height:1.7}
</style>

<div class="wrap">
  <header>
    <div class="hrow">
      <button class="back" id="back" hidden>← 一覧</button>

      <div class="hclock mono" id="clock">--:--</div>
    </div>
  </header>
  <main id="main"></main>
</div>

「1頭だけ強くて2番手以下が13頭にばらけている形は買わない」という設計が、今回はたまたま裏目に出た形になる。\nここまで3レースで、2番人気を全部買っていれば360円/300円＝120%。ただしこれは3件の話で、この戦略が条件を満たすのは全レースの8.2%。買わなかったレースで2番人気が来るのは日常的に起きる。"},"4":{"time":"11:15","text":"朝の解説は古いオッズによるものだったので書き直す。最新値（11:14、発走21分前）では1番人気エイントノーウェイが4.7→3.9倍と締切前に買われ、m3も0.481→0.528に上がった。それでも新馬戦15頭立てらしく票が割れていて、集中度の条件（0.75）には遠い。\n2番人気スウィートライトと3番人気ワンスフォーユーが4.9倍で完全に並んでいる。モデルはこの2頭を逆に見ていて、スウィートライト −0.042、ワンスフォーユー +0.049。わずかな差だが、同じオッズの2頭に序列をつけているのがモデルの仕事らしいところ。\n新馬戦なので出走馬に過去走が無く、モデルの補正量はどれも小さい（最大でも±0.09）。材料が無ければモデルも市場と同じことしか言えない、という形がそのまま出ている。\n動いたのは6番人気リケアワルツで15.0倍→19.1倍と売られた。採用条件は集中度と乖離の2つとも外れている。"},"5":{"time":"08:30","text":"m3=0.725と集中度はあと一歩。しかし上位2頭(シホノノービレ −0.016、キングリア −0.057)がどちらも負の乖離で、モデルは上位の評価を下げている。代わりに4番人気ニューイントリーグ +0.097、5番人気アヴァロン +0.120 と、下の方を拾っている。\n前夜から1番人気と2番人気が入れ替わったレース。前夜は7番キングリア2.7倍が1番人気だったが、今朝は6番シホノノービレ2.3倍が上に立った。\n「6番人気の単勝107%」が今日のレース別最良値だが、これは「5番人気帯 × 混戦気味 × 乖離プラス」のセルの過去平均であって、この馬が特別に良いという意味ではない。サンプル1,035件の平均値で、的中率は数%。1レース単位では何の保証もない数字だと理解した上で眺めるのが正しい。"},"6":{"time":"08:30","text":"1勝クラスなのでそもそも対象外(過去ROI 94.0%)。ただし今日いちばん「妙味馬」が多いレースで、乖離≥0.2かつ8〜30倍の馬が3頭もいる。クラッチスラッガー(12.8倍 +0.241)、ロットブラータ(13.4倍 +0.316)、ディープサミット(16.7倍 +0.292)。\n同時に3番人気エイユーファイヤーが −0.370 と今日の全馬で最大の負の乖離。市場は9.2%と見ているがモデルは6.4%。市場が買い被っている馬と、置いていかれている馬が、同じレースに同居している。\nモデルの情報は「割高な馬を避ける」側にこそ安定して存在する、という検証結果がある。過大評価側は凍結アウトオブサンプル検定で再現したが、過小評価側は消えた。だから本来この−0.370のほうが信頼できる情報で、+0.3台の3頭は「そう見えているだけ」の可能性が高い。1レースに3頭も出るのは偏りの兆候でもある。"},"7":{"time":"08:30","text":"18頭立て、dom12=1.11で1番人気と2番人気がほぼ並ぶ完全な混戦。m3=0.442。\nこのレースの主役は5番人気ベルサンローラン(10.6倍、乖離+0.319)。市場は7.5%と見ているがモデルは10.3%を出している。今日の妙味馬9頭のうち、乖離の大きさでは上位。\n対照的に3番人気ヴァージルは −0.223。7.9倍という人気に対してモデルは8.0%しか与えていない。\n前夜から1番人気と2番人気が入れ替わった。前夜は12番ケールハイム4.7倍が1番人気だったが、今朝は2番ダンデノン4.4倍が上。18頭立ての1勝クラスは票が薄く広がるので、締切まで順位は動き続けるはず。10分前の判定でまた違う顔になっている可能性が高い。"},"8":{"time":"08:30","text":"今日いちばん興味深い歪みが出ているレース。上位3頭の単勝が3.7倍・4.0倍・4.1倍とほぼ横並びなのに、複勝プールでの評価が全く違う。3番ロードアルディートは複勝1.3〜1.6倍で複勝1番人気、6番ディニテは複勝2.9〜4.3倍で複勝7番人気。単勝でほぼ同格の馬が、複勝では7つも人気順が違う。\nモデルもロードアルディートに +0.169、レッドフレーザーに −0.174 と、はっきり序列をつけている。単勝プールが3頭を同格と見ているのに、複勝プールとモデルの両方が「3番が上」と言っている形。\nこれは朝のプールが薄いことによる歪みの可能性が高い。複勝プールは単勝より出来高が小さく、朝のうちは少額の投票で大きく動く。発走30分前の再判定で、この差がどこまで残るか見どころ。前夜から m3 が 0.708→0.608 と最も大きく下がったレースでもある。"},"9":{"time":"08:30","text":"2勝クラスなので対象クラス内。しかし m3=0.492 と集中度が足りず、さらに2番人気ピカラの乖離が −0.194 と大きく負。市場は17.7%と見ているがモデルは14.5%。\nこのレースはモデルの見解が市場とかなり食い違っている。1番人気ポートデラメール +0.094、3番人気ヤマニンバロネス +0.164、5番人気コロナドブリッジ +0.239 と、2番人気以外を軒並み持ち上げている。つまり「2番人気だけが買われすぎ」という読み。\nこういう形は本戦略が探しているものの真逆にあたる。戦略は「2番人気が過小評価されているレース」を買うので、2番人気が過大評価されているなら当然見送り。条件式は m3 と乖離の2つだけだが、外れ方にも意味の違いがある。"},"10":{"time":"08:30","text":"m3=0.441、dom12=1.28で市場が割れている。前夜から1番人気が4.3倍まで緩み(前夜3.2倍)、逆に3番人気が7.5→7.1倍と詰めた。3勝クラスらしく力が拮抗している。\n妙味馬が2頭。4番人気キタサンハナビラ(10.0倍 +0.236)と9番人気ファームツエンティ(17.5倍 +0.201)。一方で5番人気ベトルスは −0.231 で、10.4倍という評価に対してモデルは6.1%しか出していない。4番人気と5番人気がオッズ上は10.0倍と10.4倍でほぼ同じなのに、モデルの中では 0.100 対 0.061 と1.6倍の差がついている。\n同じ価格帯の中で優劣をつけるのがこのモデルの仕事で、それは順位付けの精度(AUC)ではなく「その価格帯で市場が高すぎるか安すぎるか」というキャリブレーションのズレを学習しているから。AUCは市場と互角(0.8381対0.8379)なのにROIには効く、というのはそういう意味。"},"11":{"time":"08:30","text":"本日のメイン。ロブチェンが1.5倍の断然人気で dom12=5.07、1番人気が2番人気の5倍支持されている今日いちばんの1強。\nモデルはロブチェンをさらに買っていて乖離 +0.050(市場52.9%→モデル55.6%)。一方で2番人気グリーンエナジーは −0.225 と大きく割り引き、3番ゴーラッキー +0.063、4番コンジェスタス +0.053 と下を拾う。「1番人気は強い、2番人気は買われすぎ、3〜4番人気が置いていかれている」という読み。\nこの形は過去データでも意味を持つ。m3≥0.70のレースで2番人気の乖離が負のとき、ワイド1-3が91.4%、ワイド1-2が86.8%。逆に2番人気の乖離が正なら1-2が91.2%、1-3が76.5%と、符号できれいに反転する。つまり「割高な2番人気を飛ばす」方向自体は本物。ただし91%は依然マイナスで、買う根拠にはならない。\n採用条件から外れた理由は3つ全部(集中度0.708で不足、乖離が負、OP重賞は対象外)。ちなみにOP重賞での過去ROIは93.5%で、戦略が成立しないクラス。"},"12":{"time":"08:30","text":"最終レース。4番人気ジャカルタバオが −0.331 と今日2番目に大きい負の乖離。7.8倍という人気に対してモデルは7.3%しか与えていない。一方で5番人気ゴーゴーパンチは +0.148、9番人気シュネーグロッケン(25.3倍)は +0.394 で今日の全馬中で最大。\n最終レースは資金を取り返そうとする投票が入りやすく、人気薄に票が流れやすいと言われる。ただし今日のデータで見る限り m3=0.482 は他の混戦レースと変わらず、特別に荒れる形にはなっていない。\nこの戦略にとっては、最終レースだろうと条件は同じ。集中度が足りなければ買わない。「最後だから何か買う」は、検証を通じていちばん排除したかった行動そのもの。"}}};
  let PKTAB="ev";

  function nextCheck(){const n=nowMin();return schedule().find(s=>s.t>=n)||null;}

    const m=h.match(/^#\/r\/(\d+)$/);

    const bet=s&&s.verdict==="bet"&&Array.isArray(s.bets)&&s.bets.length;
    let h="";

    if(bet){const b=s.bets[0];
      h+='<div class="vmain">R'+b.race+" "+b.horse+"番 "+esc(b.name)+' の複勝</div>'+
         '<div class="vsub">単勝'+b.odds+"倍／"+esc(b.note||"")+'</div>';
    }else if(s){
      h+='<div class="vmain">買わない</div><div class="vsub">'+esc(s.reason||"条件を満たすレースがありません。")+'</div>';

      h+='<div class="vmain">まだ判定していません</div><div class="vsub">最初の判定は 09:30（R1 発走30分前）の予定です。</div>';
    }
    let upd=s?esc(s.updatedAt||"—"):"—";

    h+='</div></div><div class="vmeta"><span>更新 <b>'+upd+'</b></span>'+
       '<span>オッズ <b>'+(s?esc(s.oddsTime||"—"):"—")+'</b></span>'+
       '<span>次の判定 <b>'+(nx?fmt(nx.t)+"（R"+nx.r+" "+nx.lead+"分前）":"本日終了")+'</b></span></div></div>';

    if(s&&s.stale){
      h+='<div class="warnbar"><b>このオッズはまだ古い</b>（発走'+s.oddsAge+'分前の値）。'+
         '前夜→朝の実測で7/12レースの人気順が入れ替わり、戦略は±40%の変動で崩壊します。'+
         '発走30分前の判定まで、下の内容は参考値として見てください。</div>';
    }
    const bo=(s&&Array.isArray(s.bestOptions))?s.bestOptions:[];
    const bg=(s&&Array.isArray(s.bigOptions))?s.bigOptions:[];
    if(bo.length||bg.length){
      h+='<h2>それでも買うなら（全12レース横断）</h2>'+
         '<div class="tabs"><button class="tab'+(PKTAB==="ev"?" on":"")+'" data-tab="ev">期待ROI順</button>'+
         '<button class="tab'+(PKTAB==="pay"?" on":"")+'" data-tab="pay">高配当狙い</button></div>'+
         '<div class="rlist" style="margin-top:8px">';
      const list = PKTAB==="pay"?bg:bo;
      h += list.map(function(o){
        const right = PKTAB==="pay"
          ? '<div class="pkpay mono">'+(o.pay?o.pay.toLocaleString()+'円':"—")+'</div>'
          : '<div class="pkroi mono '+(o.roi>=100?"over":"")+'">'+o.roi.toFixed(1)+'</div>';
        const sub = PKTAB==="pay"
          ? 'ROI '+o.roi.toFixed(1)+'% ／ 的中率'+(o.hit!=null?o.hit+"%":"—")+' ／ 過去'+o.n.toLocaleString()+'件'
          : '的中率'+(o.hit!=null?o.hit+"%":"—")+' ／ 過去'+o.n.toLocaleString()+'件';
        return '<button class="pickrow" data-r="'+o.r+'">'+right+
          '<div class="pkmid"><div class="pkbet"><em>R'+o.r+' '+(o.post||"")+'</em>'+esc(o.bet)+'</div>'+
          '<div class="pkpick">'+esc(o.pick)+'</div>'+
          '<div class="pkmeta">'+sub+'</div></div>'+
          '<div class="pkgo">詳細 ›</div></button>';
      }).join("");
      h+='<div class="pkhint">'+
         (PKTAB==="pay"
           ? '的中時の中央配当が高い順。<b>ROIはどれも100%前後かそれ以下</b>で、当たれば大きいぶん当たらない。'
           : '過去の同条件セルの平均ROI順。同じレースからは2つまで。<b>ほぼすべて期待値マイナス</b>で買いの推奨ではない。')+
         '</div></div>';
    }
    h+='<h2>レース別（タップで詳細）</h2><div class="rlist">';
    for(let r=1;r<=12;r++){
      const x=raceOf(r)||{},p=mins(POSTS[r]),isNext=nx&&nx.r===r,done=p<=n;
      const best=Array.isArray(x.options)&&x.options.length?x.options[0]:null;
      const hit=x.m3!=null&&x.dv!=null&&x.m3>=0.75&&x.dv>0&&OK_CLS.has(x.cls);
      h+='<button class="rcard '+(isNext?"next":(done?"done":""))+'" data-r="'+r+'">'+
         '<div class="rno mono">'+r+'</div><div class="rmid">'+
         '<div class="rname">'+esc(x.name||"—")+'</div>'+
         '<div class="rsub mono">'+POSTS[r]+' 発走'+(x.shape?' ／ <span class="pill shape">'+esc(x.shape)+'</span>':"")+
         (x.m3!=null?' <span class="thr">m3 '+x.m3.toFixed(3)+'</span>':"")+
         (x.oddsAge>=60?' <span class="thr neg">オッズ'+x.oddsAge+'分前</span>':"")+
         (x.modelPick&&!x.modelPick.agree?' <span class="pill shape">モデル別推し</span>':"")+
         (function(){const q=(STATE&&STATE.results||{})[String(r)];
           return q?'<span class="rres'+(q.p2hit?"":" hit")+'">'+
             (q.p2hit?"2人気3着内":"2人気圏外")+'</span>':"";})()+'</div></div>'+
         '<div class="rright">'+(hit?'<span class="pill go">買い</span>':
            (best?'<div class="rbest mono '+(best.roi>=100?"over":"")+'">'+best.roi.toFixed(0)+'%</div>':'<div class="rbest">—</div>'))+
         '<div class="rarrow">詳細 ›</div></div></button>';
    }
    h+='</div>';
    h+='<div class="log" id="log"></div>';

    h+='<div class="note"><p><b>このページは何を判定しているか</b></p>'+
       '<p>「市場が上位3頭に集中（m3≥0.75）」「2番人気をモデルが市場より高く評価（乖離&gt;0）」「新馬・未勝利・2勝・3勝クラス」——この3つが揃ったレースだけ2番人気の複勝を1点買う戦略です。</p>'+
       '<ul><li>過去実績 ROI 113.1%、最大ドローダウン1.5%、最長連敗7</li>'+
       '<li><b>該当するのは全レースの8.2%。</b>ゼロの日も普通にあります</li>'+
       '<li>「買わない」は異常ではなく<b>正常な出力</b>です</li></ul>'+
       '<p style="margin-top:8px">各レースの「それでも買うなら」は<b>ほぼすべて期待値マイナス</b>です。読み物としてお使いください。</p>'+
       '<p>判定は発走30分前と10分前。前夜→朝の実測で7/12レースの人気順が入れ替わり、戦略は±40%の変動で崩壊するためです。</p></div>';
    h+='<footer>当日より前の全データ（127,757行）で学習し直した市場オフセットモデル（木100本×6シード平均）による。オッズは netkeiba 公開APIから2秒間隔で取得。</footer>';
    return h;
  }

  /* ───────── レース詳細 ───────── */
  function raceView(r){

    const hit=x.m3>=0.75&&x.dv>0&&OK_CLS.has(x.cls);
    let h="";

    h+='<div class="sec"><div class="kv">'+
       '<div><b>発走</b><span class="mono">'+POSTS[r]+'</span></div>'+

       '<div><b>頭数</b><span class="mono">'+(x.n||"—")+'</span></div>'+
       '<div><b>市場の形</b>'+esc(x.shape||"—")+'</div>'+

       '<div><b>1番人気/2番人気</b><span class="mono">'+(x.dom12!=null?x.dom12.toFixed(2)+"倍":"—")+'</span></div>'+

         (x.oddsAge!=null?"発走"+x.oddsAge+"分前":"—")+'</span></div></div>'+
       '<div class="secbody"><p>'+esc(x.shapeDesc||"")+'</p>'+
       (hit?'<p style="color:var(--go);font-weight:700">3条件すべて成立。2番人気の複勝が買い目です。</p>'
           :'<p><b>採用条件から外れた理由</b></p><ul style="margin:0;padding-left:17px">'+

    h+='<div class="sec"><div class="sechead">採用条件</div>'+
       cond("市場集中度 m3 ≥ 0.75","上位3頭の市場確率合計。基礎ROIを100%まで持ち上げる価格選択",
            x.m3!=null?x.m3.toFixed(3):"—", x.m3!=null?x.m3>=0.75:null)+
       cond("2番人気の乖離 > 0","モデルが市場より高く見ているか。唯一の情報としての優位",
            x.dv!=null?(x.dv>0?"+":"")+x.dv.toFixed(3):"—", x.dv!=null?x.dv>0:null)+
       cond("クラスが 新馬/未勝利/2勝/3勝","1勝クラス94.0%・OP重賞93.5%では成立しない",
            esc(x.cls||"—"), x.cls?OK_CLS.has(x.cls):null)+'</div>';

    if(Array.isArray(x.horses)&&x.horses.length){
      const mp=x.modelPick;
      const rs=(STATE.results||{})[String(r)];
      if(rs){
        const ok=!rs.p2hit;   // 買わない判定だったので、2番人気が外れていれば正解
        h+='<div class="sec"><div class="sechead">結果</div>'+
           '<div class="resbar'+(ok?" ok":"")+'"><b>着順 '+
           rs.order.slice(0,3).map(function(o){return o[1]+'番';}).join(' → ')+'</b>'+
           '<span class="sub">判定対象だった2番人気 '+rs.p2no+'番は'+
           (rs.p2hit?('<b>3着内</b>（複勝'+rs.p2pay+'円）'):'<b>圏外</b>')+

          (mp.agree
            ? '<b>モデルの1位指名は市場と一致</b>（'+mp.no+'番 '+esc(mp.name)+' '+mp.odds.toFixed(1)+'倍）'
            : '<b>モデルは '+mp.no+'番 '+esc(mp.name)+'（市場'+mp.mktRank+'番人気 '+mp.odds.toFixed(1)+'倍）を1位に推す</b>')+
          '<span class="sub">2つ以上順位が動いた馬 '+(x.nMoved!=null?x.nMoved:"—")+'頭'+
          (mp.agree?"":" ／ 市場と食い違ったとき、当たるのはモデル49%・市場51%")+'</span></div>':"")+
        x.horses.map(function(t){

          const bits=[];

          if(t.rest!=null) bits.push('<span>中'+t.rest+'日</span>');
          if(t.leg) bits.push('<span>'+t.leg+'</span>');
          if(t.starts===0) bits.push('<span>初出走</span>');
          else if(t.starts!=null) bits.push('<span>'+t.starts+'戦</span>');
          if(t.wtDiff!=null&&t.wtDiff!==0) bits.push('<span>馬体'+(t.wtDiff>0?"+":"")+t.wtDiff+'kg</span>');
          if(t.classUp!=null&&t.classUp>0) bits.push('<span>昇級</span>');

              '<div><b>3着内の推定</b><span class="mono">'+t.p3.toFixed(1)+'%</span></div>'+
              '<div><b>複勝の期待値</b><span class="mono ev '+(ev!=null&&ev>=100?"good":"bad")+'">'+
                 (ev!=null?ev.toFixed(0)+"%":"—")+'</span></div>'+
              '<div><b>乖離</b><span class="mono '+(t.dv>0?"pos":"neg")+'">'+
                 (t.dv>0?"+":"")+t.dv.toFixed(3)+'</span>'+bar+'</div>'+
            '</div>'+
            (bits.length?'<div class="h3r">'+bits.join("")+'</div>':"")+
            '</div>';
        }).join("")+
        '<div class="legend">'+
        '<div class="lgitem"><b>3着内の推定</b>'+
        '<p>単勝オッズから各馬の3着内率を計算したもの。<b>市場の意見を整形しただけ</b>で、独立した予想ではない。</p>'+
        '<p>計算にはPlackett-Luceという方法を使うが、これは「各馬が独立に走る」と仮定するため'+
        '<b>上位人気の3着内率を高く見積もりすぎる</b>。9,363レースで実測した補正'+
        '（1番人気×0.882、2番人気×0.897、4番人気×0.995、6番人気×1.153）を掛けてある。</p>'+
        '<p class="howto"><b>使い方</b>：複勝配当と掛けたものが「複勝の期待値」。'+

        'ただしどちらが正しいかは分からないし、朝は複勝プールが薄く配当の幅が広いので数字が暴れる。'+
        '幅の狭い（下限と上限が近い）馬ほど信用できる。</p></div>'+

        '<div class="lgitem"><b>モデル○位</b>'+
        '<p>モデルが予測した勝率の順位。市場の人気順と違うときだけ色が付き、'+
        '↑は市場より高く、↓は低く評価していることを示す。</p>'+
        '<p class="howto"><b>ここが肝心</b>：モデルの1位指名は<b>89.5%が市場1番人気と同じ馬</b>。'+
        '残り10.5%で食い違ったときも、当たったのは<b>モデル49%・市場51%</b>でほぼ引き分け。'+
        '<b>勝ち馬を当てる力にモデルの優位は無い</b>（AUCはモデル0.8384、市場0.8379でほぼ同点）。</p>'+
        '<p class="howto">モデル順位ごとの単勝ROIも1位79.8%・2位82.5%・3位76.0%と、'+
        'どれも控除率どおり。<b>「モデルの本命だから買う」には根拠がない</b>。'+
        '意味があるのは順位そのものではなく、次の「乖離」のほう。</p></div>'+

        '<div class="lgitem"><b>乖離</b>'+
        '<p>モデルの評価 ÷ 市場の評価（対数）。正ならモデルは市場より高く見ている。'+
        '帯ごとの実績は下表のとおり（同じオッズ帯・同じ頭数の馬と比べた値）。</p>'+
        '<div class="dt"><table><thead><tr><th>乖離</th><th>単勝ROI</th><th>複勝ROI</th><th>頭数</th></tr></thead><tbody>'+
        '<tr><td>+0.20以上</td><td class="num">88.9%</td><td class="num">80.0%</td><td class="num">8,250</td></tr>'+
        '<tr><td>+0.05〜+0.20</td><td class="num">85〜88%</td><td class="num">76%</td><td class="num">19,468</td></tr>'+
        '<tr><td>−0.05〜+0.05</td><td class="num">78.9%</td><td class="num">75.9%</td><td class="num">21,945</td></tr>'+
        '<tr><td>−0.20〜−0.05</td><td class="num">60〜68%</td><td class="num">67〜72%</td><td class="num">20,097</td></tr>'+
        '<tr><td class="lo">−0.20以下</td><td class="num lo">45.4%</td><td class="num lo">54.4%</td><td class="num">11,245</td></tr>'+
        '</tbody></table></div>'+
        '<p class="howto"><b>使い方その1 — 避ける側がいちばん確実。</b>'+
        '乖離−0.20以下の馬は単勝45.4%・複勝54.4%。全体平均（73%/72%）から30ポイント近く落ちる。'+
        '市場の誤りは「買われすぎ」方向にしか安定して存在しないことが検証で分かっており、'+
        '<b>この負の側が最も信用できる使い方</b>。</p>'+
        '<p class="howto"><b>使い方その2 — 正でも単独では買えない。</b>'+
        '乖離+0.20以上でも単勝88.9%止まりで、まだ負ける。'+
        '「割安に見える」ことと「買って儲かる」ことは違う。控除率20%を埋めきれていない。</p>'+
        '<p class="howto"><b>使い方その3 — ±0.05以内は読まない。</b>'+
        'この帯は78.9%で全体平均とほぼ同じ。誤差の範囲なので意味を探さないほうがよい。</p>'+
        '<p class="howto"><b>買いに効くのは1か所だけ。</b>'+
        'm3≥0.75のレースの<b>2番人気</b>に限って乖離を重ねたときだけ、100.3%→107.2%と'+
        '損益分岐を超える。それ以外の場所では、乖離は「買う理由」ではなく'+
        '<b>「避ける理由」として使うのが正しい</b>。</p></div>'+
        '</div></div>';
    }

    if(Array.isArray(x.options)&&x.options.length){
      h+='<div class="sec"><div class="sechead">それでも買うなら ／ 期待ROI順</div>'+
         x.options.map(o=>'<div class="fbrow">'+
           '<div class="fbroi mono '+(o.roi>=100?"over":"")+'">'+o.roi.toFixed(1)+'</div><div>'+
           '<div class="fbbet">'+esc(o.bet)+'</div>'+
           '<div class="fbpick">'+esc(o.pick)+(o.odds?'<span class="thr"> '+o.odds+'倍</span>':"")+'</div>'+
           '<div class="fbmeta mono">過去'+o.n.toLocaleString()+'件'+(o.hit!=null?' ／ 的中率'+o.hit+'%':"")+'</div>'+

           '</div></div>').join("")+
         '<div class="secbody" style="border-top:1px solid var(--edge2);color:var(--ink3);font-size:11.5px">'+
         '数字は同じ「人気順位 × 市場集中度 × 乖離の符号」だった過去レースの平均ROI。'+
         '100%未満＝期待値マイナスで、買いの推奨ではありません。</div></div>';
    }

    if(Array.isArray(x.value)&&x.value.length){
      h+='<div class="sec"><div class="sechead">妙味馬（乖離≥0.2 かつ 8〜30倍）</div>'+
         x.value.map(v=>'<div class="hrow2"><div class="hrank">·</div>'+
           '<div class="hname">'+v.no+'番 '+esc(v.name)+'</div>'+
           '<div class="hodds mono">'+v.odds.toFixed(1)+'</div>'+
           '<div class="hdv mono pos">+'+v.dv.toFixed(3)+'</div></div>').join("")+
         '<div class="secbody" style="border-top:1px solid var(--edge2);font-size:11.5px;color:var(--ink3)">'+
         'この条件の単勝を全部買った場合の過去ROIは101.6%で、唯一100%を超えるセル。'+
         'ただし日単位で勝てる確率57%、最長連敗77、上位3本の配当を除くと98.4%。</div></div>';
    }

    if(STATE.notes&&STATE.notes[String(r)]){
      const nt=STATE.notes[String(r)];
      h+='<div class="sec"><div class="sechead">解説 ／ '+esc(nt.time||"")+' 時点</div>'+
         '<div class="secbody">'+nt.text.split("\n").filter(Boolean).map(p=>'<p>'+esc(p)+'</p>').join("")+'</div></div>';
    }
    return h;
  }


  /* ───────── 解説 ───────── */
  function aboutView(){
    return '<div class="doc">'+

    '<p class="lead">このボードは「どの馬が勝つか」を当てにいっていません。' +
    '当てにいって市場に勝てないことは、先に確かめてあります。' +
    'やっているのは<b>どのレースなら買う価値があるかの選別</b>です。</p>'+

    '<h3>まず、市場には勝てない</h3>'+
    '<p>単勝オッズから控除率を抜いた市場の予測精度はAUC 0.8379。こちらのモデルは0.8381。ほぼ互角です。'+
    '特徴量を67個に増やし、血統50個、メンバー構成15個、Eloレーティング、ペース構成、絶対タイム指数——'+
    '思いつくものを全部入れましたが、どれもAUCを動かしませんでした。</p>'+
    '<p>単勝で収支を合わせるには AUC を +0.06〜0.08 上げる必要があります。到達できたのは +0.0015。'+
    '必要量の2%です。<b>ボトルネックはアルゴリズムではなく情報</b>で、'+
    'ニューラルネットにしようがアンサンブルしようが変わりません。</p>'+

    '<h3>ではどこに勝ち目があるか</h3>'+
    '<p>券種ごとに、何も絞らずに買ったときの回収率を測ると、はっきり分かれます。</p>'+
    '<div class="dt"><table><thead><tr><th>券種</th><th>実データ</th><th>控除率からの期待値</th><th>差</th></tr></thead><tbody>'+
    '<tr><td>単勝1番人気</td><td class="num">79.7%</td><td class="num">80.0%</td><td class="num">−0.3</td></tr>'+
    '<tr><td>複勝1番人気</td><td class="num">85.6%</td><td class="num">80.0%</td><td class="num hi">+5.6</td></tr>'+
    '<tr><td>複勝2番人気</td><td class="num">84.6%</td><td class="num">80.0%</td><td class="num hi">+4.6</td></tr>'+
    '<tr><td>ワイド1-2番人気</td><td class="num">82.2%</td><td class="num">77.5%</td><td class="num hi">+4.7</td></tr>'+
    '<tr><td>馬連1-2番人気</td><td class="num">83.7%</td><td class="num">77.5%</td><td class="num hi">+6.2</td></tr>'+
    '<tr><td>3連複1-2-3番人気</td><td class="num">81.6%</td><td class="num">75.0%</td><td class="num hi">+6.6</td></tr>'+
    '</tbody></table></div>'+
    '<p><b>単勝プールだけが控除率どおり＝効率的</b>です。歪んでいるのは複勝・ワイド・馬連・3連複という二次プール。'+
    'この+5〜7ptが、このプロジェクトの利益源のすべてです。</p>'+
    '<div class="callout">モデルを使わない検証でも、同じ結論が別角度から出ました。'+
    '市場は<b>「勝つ確率」はほぼ正しく値付けし、「崩れない確率」を目立つ馬について過大評価</b>しています。'+
    '目立たない馬の勝率のズレはz≈0.5（ほぼゼロ）ですが、3着内率のズレはz=3.2〜3.9。'+
    'だから単勝では効かず、複勝でだけ効きます。</div>'+

    '<h3>なぜ2番人気なのか</h3>'+
    '<p>複勝には「最低100円は返ってくる」という制度があります。'+
    'これが下支えに見えて、実は<b>1番人気の上限を作る拘束</b>でした。</p>'+
    '<div class="dt"><table><thead><tr><th></th><th>的中率</th><th>元返しの割合</th><th>的中時の平均配当</th><th>ROIの上限</th></tr></thead><tbody>'+
    '<tr><td>複勝1番人気</td><td class="num">90.2%</td><td class="num lo">38.8%</td><td class="num">106.8円</td><td class="num lo">106.8%</td></tr>'+
    '<tr><td>複勝2番人気</td><td class="num">70.6%</td><td class="num">11.9%</td><td class="num">143.8円</td><td class="num">143.8%</td></tr>'+
    '<tr><td>複勝3番人気</td><td class="num">37.8%</td><td class="num">1.9%</td><td class="num">214.6円</td><td class="num">—</td></tr>'+
    '</tbody></table></div>'+
    '<p>市場が集中したレースでは、1番人気の複勝は4割近くが100円返しになります。'+
    '仮に100%当たってもROIは106.8%止まりで、損益分岐には93.6%の的中率が必要。'+
    '<b>最も確実なレースほど元返しで刈り取られる</b>のです。'+
    '2番人気はちょうどその床を抜けた位置にいて、床の損を受けずに過小評価だけを取れます。</p>'+

    '<h3>4つの条件が何をしているか</h3>'+
    '<p>条件は役割が違います。片方は「価格の選択」、もう片方が「情報」です。</p>'+
    '<div class="dt"><table><thead><tr><th>条件</th><th>ROI</th><th>層化帰無</th><th>z</th></tr></thead><tbody>'+
    '<tr><td>全2番人気（無条件）</td><td class="num">85.9</td><td class="num">85.9</td><td class="num">0.00</td></tr>'+
    '<tr><td>m3≥0.75 のみ</td><td class="num">100.3</td><td class="num">99.2</td><td class="num lo">0.41</td></tr>'+
    '<tr><td>＋乖離&gt;0</td><td class="num">107.2</td><td class="num">99.2</td><td class="num">2.27</td></tr>'+
    '<tr><td>＋クラス絞り</td><td class="num hi">113.1</td><td class="num">98.8</td><td class="num hi">3.38</td></tr>'+
    '<tr><td>乖離≤0（逆条件）</td><td class="num lo">81.5</td><td class="num">85.5</td><td class="num lo">−2.50</td></tr>'+
    '</tbody></table></div>'+
    '<p><b>m3（市場集中度）単独では z=0.41</b>。オッズ帯と集中度で層化すると、'+
    '85.9%→100.3%の上昇はほぼ完全に説明されてしまいます。'+
    'つまりこれは情報ではなく「基礎ROIが100%になる価格帯を選んでいるだけ」。ちょうど損益分岐に届きます。</p>'+
    '<p>そこから先へ押し上げるのが<b>モデルの乖離</b>です。逆条件が対称に沈む（z=−2.50）ことも、'+
    'これが本物の情報である傍証になります。</p>'+

    '<h3>モデルの中身</h3>'+
    '<p>市場オフセット型のXGBoostです。<code>base_margin = logit(市場確率)</code> を置いて、'+
    'オッズを特徴量に使わない63個だけで<b>市場からのズレ</b>を学習します。'+
    '市場の答えを先に見せた上で「間違っているところを指摘してみろ」と言う構成です。</p>'+
    '<p>このモデルは順位付け（AUC）を改善しません。学習しているのは'+
    '<b>「その価格帯で市場が高すぎるか安すぎるか」というキャリブレーションのズレ</b>で、'+
    'だから馬を並べ替える力は無いのに回収率には効きます。</p>'+
    '<p>学習は判定のたびに当日より前の全データ（127,757行）でやり直します。'+
    '木は100本固定、6シードの平均。early stopping は使いません——'+
    '使うと木の本数が1〜87本で乱高下し、<b>同じコードの再実行で結論が変わる</b>ことが分かったためです。</p>'+

    '<h3>ここに辿り着くまでに捨てたもの</h3>'+
    '<p>候補は6つの関門で落としました。落ちたものを見るほうが、残ったものの意味が分かります。</p>'+
    '<div class="dt"><table><thead><tr><th>関門</th><th>落ちたもの</th></tr></thead><tbody>'+
    '<tr><td>層化帰無 FWER</td><td>無差別スイープ88,595セル全部（p=0.41）</td></tr>'+
    '<tr><td>先読みの修正</td><td>能力ばらつき系 123%→101.5%</td></tr>'+
    '<tr><td>裾依存</td><td>乖離単独の単勝 上位10本除外で96%→79%</td></tr>'+
    '<tr><td>シード安定性</td><td>旧fitでFWERを通った13セル中13セル</td></tr>'+
    '<tr><td>オッズ摂動</td><td>4番人気複勝 110.2%→98.8%</td></tr>'+
    '</tbody></table></div>'+
    '<p>特に重要なのが最後の<b>オッズ摂動テスト</b>です。確定オッズで110.2%出ていた条件が、'+
    'オッズを±5%揺らすと102.0%、±10%で98.8%まで落ちました。'+
    '我々は締切前に賭けるので、確定オッズを前提にした条件は実運用で崩れます。'+
    '<b>ROIが最も高い条件ほど、この検定で落ちました。</b></p>'+
    '<div class="dt"><table><thead><tr><th>摂動</th><th>採用条件</th><th>乖離を外した場合</th></tr></thead><tbody>'+
    '<tr><td>なし</td><td class="num">113.8</td><td class="num">100.3</td></tr>'+
    '<tr><td>±5%</td><td class="num hi">112.7</td><td class="num lo">99.4</td></tr>'+
    '<tr><td>±10%</td><td class="num hi">111.2</td><td class="num lo">98.4</td></tr>'+
    '<tr><td>±20%</td><td class="num hi">106.8</td><td class="num lo">95.5</td></tr>'+
    '<tr><td>±40%</td><td class="num lo">95.8</td><td class="num lo">—</td></tr>'+
    '</tbody></table></div>'+
    '<p>±40%で崩壊します。前夜→朝のオッズ変動は中央値15.2%、90%点43.6%。'+
    '<b>朝のオッズはこの崩壊域にかかっている</b>ので、判定を発走30分前と10分前に置いています。</p>'+

    '<h3>成績と、正直な限界</h3>'+
    '<div class="dt"><table><tbody>'+
    '<tr><td>ROI</td><td class="num hi">113.1%</td></tr>'+
    '<tr><td>3分割（早期/中期/後期）</td><td class="num">119.3 / 106.1 / 119.3</td></tr>'+
    '<tr><td>的中率</td><td class="num">73.5%</td></tr>'+
    '<tr><td>最大ドローダウン</td><td class="num">1.5%</td></tr>'+
    '<tr><td>最長連敗</td><td class="num">7</td></tr>'+
    '<tr><td>日単位で勝てる確率</td><td class="num">98.2%</td></tr>'+
    '<tr><td>対象率</td><td class="num">全レースの8.2%</td></tr>'+
    '</tbody></table></div>'+
    '<ul>'+
    '<li>標本は2025年1月以降の487点のみ。アウトオブサンプル予測が必要なためこれ以上遡れません</li>'+
    '<li>探索の末に到達した条件で、そこへ至る経路の探索は多重比較の罰則に含まれていません</li>'+
    '<li>クラス絞りは成績を見てから決めたので、基準版の107.2%のほうを実力と見るべきです</li>'+
    '<li>1勝クラス94.0%・OP重賞93.5%では成立しません</li>'+
    '<li>少額から試すのが妥当です</li>'+
    '</ul>'+

    '<h3>画面の数字をどう使うか</h3>'+
    '<p>各レースの出走馬カードに出る3つの数字は、性格がまったく違います。'+
    '同じように扱うと必ず間違えます。</p>'+

    '<p><b>1. 3着内の推定 ― 市場の意見であって、予想ではない</b></p>'+
    '<p>単勝オッズから計算しているので、これは<b>市場が言っていることを整形しただけ</b>です。'+
    'モデルの意見は一切入っていません。だから「推定が高いから買う」は'+
    '「人気だから買う」と同じことで、何の優位もありません。</p>'+
    '<p>計算にPlackett-Luceという方法を使いますが、これは各馬が独立に走ると仮定するため、'+
    '<b>上位人気の3着内率を高く見積もりすぎます</b>。1番人気は理論74.5%に対し実際65.7%、'+
    '6番人気は理論18.2%に対し実際21.0%。9,363レースで測ったこのズレを補正してあります。</p>'+
    '<p>使い道は<b>複勝配当との掛け算</b>です。それが「複勝の期待値」で、'+
    '100%を超えていれば単勝プールと複勝プールの評価が食い違っているということ。'+
    'ただし<b>どちらが正しいかは分かりません</b>し、朝は複勝プールが薄いので'+
    '配当の幅（例：2.0〜6.6倍）が広く、数字が暴れます。幅の狭い馬ほど信用できます。</p>'+

    '<p><b>2. 乖離 ― 避ける側がいちばん確実</b></p>'+
    '<p>同じオッズ帯・同じ頭数の馬と比べた実績です。</p>'+
    '<div class="dt"><table><thead><tr><th>乖離</th><th>単勝ROI</th><th>複勝ROI</th><th>頭数</th></tr></thead><tbody>'+
    '<tr><td>+0.20以上</td><td class="num">88.9%</td><td class="num">80.0%</td><td class="num">8,250</td></tr>'+
    '<tr><td>+0.05〜+0.20</td><td class="num">85〜88%</td><td class="num">76%</td><td class="num">19,468</td></tr>'+
    '<tr><td>−0.05〜+0.05</td><td class="num">78.9%</td><td class="num">75.9%</td><td class="num">21,945</td></tr>'+
    '<tr><td>−0.20〜−0.05</td><td class="num">60〜68%</td><td class="num">67〜72%</td><td class="num">20,097</td></tr>'+
    '<tr><td class="lo">−0.20以下</td><td class="num lo">45.4%</td><td class="num lo">54.4%</td><td class="num">11,245</td></tr>'+
    '</tbody></table></div>'+
    '<p>注目すべきは<b>上下の非対称</b>です。プラス側で最も良い帯が単勝88.9%なのに対し、'+
    'マイナス側で最も悪い帯は45.4%。全体平均73.3%からの落ち込みが、'+
    '<b>マイナス側は28ポイント、プラス側は15ポイントしかありません。</b></p>'+
    '<p>これは偶然ではありません。2025年上半期だけで軸を選び、中期＋後期で凍結して評価したところ、'+
    '<b>過大評価側は再現し（FWER p=0.0075）、過小評価側は消えました</b>（max z=1.28、帰無95%点2.31）。'+
    '市場の誤りは「買われすぎ」方向にしか安定して存在しない、ということです。</p>'+
    '<ul>'+
    '<li><b>−0.20以下 → 避ける。</b>これがいちばん信用できる使い方</li>'+
    '<li><b>+0.20以上 → 他よりマシ、ただし単勝88.9%でまだ負ける。</b>'+
    '「割安に見える」と「買って儲かる」は別。控除率20%を埋めきれていない</li>'+
    '<li><b>±0.05以内 → 読まない。</b>78.9%で全体平均とほぼ同じ。誤差です</li>'+
    '</ul>'+
    '<p>乖離が買いに効くのは<b>1か所だけ</b>。m3≥0.75のレースの2番人気に重ねたときに、'+
    '100.3%→107.2%と損益分岐を超えます。それ以外の場所では、'+
    '<b>乖離は「買う理由」ではなく「避ける理由」として使うのが正しい</b>使い方です。</p>'+

    '<p><b>3. それでも買うならのROI ― 平均であって予測ではない</b></p>'+
    '<p>同じ「人気順位 × 市場集中度 × 乖離の符号」だった過去レースの平均です。'+
    'サンプルは数百〜数千件で、的中率は数%〜70%とばらばら。'+
    '<b>その1レースで何が起きるかについては何も言っていません。</b>'+
    '「95%」は「100回買えば5%減る見込み」であって、'+
    '「この馬が95%の確率でどうこう」ではありません。</p>'+

    '<h3>結局どう行動するか</h3>'+
    '<ul>'+
    '<li><b>買うのは、判定が「買」のときだけ。</b>それ以外は全部見送り</li>'+
    '<li>読み物として眺めるぶんには、<b>乖離−0.20以下の馬を「消し」の参考にする</b>のがいちばん筋がいい</li>'+
    '<li>複勝の期待値が100%を超えている馬は、2つのプールの食い違いを表している。'+
    '面白い現象だが、それが利益になる保証はない</li>'+
    '<li><b>条件が惜しいからといって緩めない。</b>これが一番やってはいけないこと</li>'+
    '</ul>'+

    '<h3>「それでも買うなら」の数字について</h3>'+
    '<p>各レースに出している期待ROIは、同じ「人気順位 × 市場集中度 × 乖離の符号」だった'+
    '過去レースの平均です。<b>ほぼすべて100%未満＝期待値マイナス</b>で、買いの推奨ではありません。</p>'+
    '<p>唯一100%を超えるのが「乖離≥0.2 かつ8〜30倍の単勝」で101.6%。'+
    'ただし日単位で勝てる確率は57%、最長連敗77、上位3本の配当を除くと98.4%。'+
    '<b>控除率をほぼ取り返しただけで、優位は誤差の範囲</b>です。</p>'+

    '<h3>該当ゼロは正常</h3>'+
    '<p>対象は全レースの8.2%。12レース開催で約1点、ゼロの日も普通にあります。'+
    '<b>「買わない」はこの判定器の正常な出力</b>であって、壊れているわけではありません。</p>'+
    '<p>実際、9月21日に当初推奨しかけた条件（確定オッズで110.2%）は、'+
    '孤立ピーク・検証期間89.1%・±5%摂動で100%超が25回中12%という理由で撤回しました。'+
    '<b>惜しいから条件を緩める</b>——これが、6つの関門をすべて無意味にする行為です。</p>'+
    '</div>';
  }

  function cond(name,desc,val,ok){
    const mk=ok===null?'<span class="cmark">·</span>':ok?'<span class="cmark ok">✓</span>':'<span class="cmark ng">✕</span>';
    return '<div class="cond">'+mk+'<div class="cname">'+name+'<small>'+desc+'</small></div>'+
           '<div class="mono">'+val+'</div></div>';
  }

  function renderLog(){
    const el=document.getElementById("log"); if(!el) return;
    const s=STATE;
    if(!s||!Array.isArray(s.history)||!s.history.length){el.textContent="判定履歴はまだありません。";return;}
    el.innerHTML="判定履歴： "+s.history.slice(-14).map(h=>
      '<span>'+esc(h.time)+' R'+h.r+'('+h.lead+'分前) '+(h.verdict==="bet"?"★買い":"—")+'</span>').join("");
  }

  function render(){
    const rt=route();
    document.getElementById("clock").textContent=fmt(nowMin());
    document.getElementById("back").hidden = rt.view==="board";
    const x=rt.view==="race"?raceOf(rt.r):null;
    document.getElementById("htitle").textContent =
      rt.view==="race" ? ("R"+rt.r+"　"+(x?x.name:"")) :
      rt.view==="about" ? "この判定は何をしているのか" : "2026-09-21 阪神 ／ 2番人気の複勝";
    document.getElementById("main").innerHTML =
      rt.view==="race" ? raceView(rt.r) : rt.view==="about" ? aboutView() : board();
    if(rt.view==="board"){
      renderLog();
      document.querySelectorAll(".rcard").forEach(b=>{
        b.addEventListener("click",()=>{location.hash="#/r/"+b.dataset.r; window.scrollTo(0,0);});
      });
      document.querySelectorAll(".tab").forEach(b=>{
        b.addEventListener("click",()=>{PKTAB=b.dataset.tab; render();});
      });
      document.querySelectorAll(".pickrow").forEach(b=>{
        b.addEventListener("click",()=>{location.hash="#/r/"+b.dataset.r; window.scrollTo(0,0);});
      });
      const tl=document.getElementById("tolink");
      if(tl) tl.addEventListener("click",()=>{location.hash="#/about"; window.scrollTo(0,0);});
    }
  }

  document.getElementById("back").addEventListener("click",()=>{location.hash="#/";window.scrollTo(0,0);});
  window.addEventListener("hashchange",render);
  render();
  setInterval(render,20000);

     リンク共有ができなくなるため（Artifactの仕様）。
     判定のたびにページごと再公開する。開いている閲覧者には自動で届く。 */
</script>
